[project]
name = "savetunex-telegram-bot"
version = "1.0.0"
description = "Telegram Music, Video & Video-Note Downloader Bot with Shazam Recognition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "yt-dlp>=2024.12.0",
    "requests>=2.31.0",
    "shazamio>=0.8.0",
    "python-dotenv>=1.0.0",
    "pydub>=0.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
